<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaringBridge — Write a post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a2e2a;
        --muted: #4a635c;
        --paper: #f7faf8;
        --line: #c5d5ce;
        --accent: #0d6e5f;
        --accent-soft: #d8efe9;
        --glow: rgba(13, 110, 95, 0.18);
        --panel: rgba(255, 255, 255, 0.86);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: "Source Sans 3", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 50% at 10% 0%, #e4f3ee 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 100% 100%, #e8f0f5 0%, transparent 50%),
          linear-gradient(165deg, #eef5f2 0%, var(--paper) 45%, #eef2f6 100%);
      }

      .screen {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 5.5rem;
        transition: max-width 0.25s ease;
      }

      body.chat-open .screen {
        max-width: 1120px;
      }

      .brand {
        font-family: "Fraunces", serif;
        font-weight: 650;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        letter-spacing: -0.02em;
        margin: 0 0 0.35rem;
        color: var(--accent);
      }

      .lede {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.45;
      }

      .workspace {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        flex: 1;
        min-height: 0;
      }

      body.chat-open .workspace {
        grid-template-columns: 1fr;
      }

      @media (min-width: 900px) {
        body.chat-open .workspace {
          grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
          align-items: stretch;
        }
      }

      .editor {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      label.sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #post {
        flex: 1;
        width: 100%;
        min-height: min(60vh, 520px);
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1.25rem 1.35rem;
        font: inherit;
        font-size: 1.125rem;
        line-height: 1.6;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      body.chat-open #post {
        min-height: min(55vh, 560px);
      }

      #post::placeholder {
        color: #7a9189;
      }

      #post:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--glow);
      }

      .chat-panel {
        display: none;
        flex-direction: column;
        min-height: min(50vh, 420px);
        max-height: min(70vh, 640px);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 10px 30px rgba(26, 46, 42, 0.08);
        overflow: hidden;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.22s ease, transform 0.22s ease;
      }

      body.chat-open .chat-panel {
        display: flex;
        opacity: 1;
        transform: translateY(0);
        animation: panel-in 0.28s ease both;
      }

      @keyframes panel-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #f3faf7 0%, transparent 100%);
      }

      .chat-header h2 {
        margin: 0;
        font-family: "Fraunces", serif;
        font-size: 1.05rem;
        font-weight: 650;
        color: var(--accent);
      }

      .chat-close {
        border: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 1.35rem;
        line-height: 1;
        cursor: pointer;
        padding: 0.15rem 0.35rem;
        border-radius: 6px;
      }

      .chat-close:hover {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .bubble {
        max-width: 92%;
        padding: 0.7rem 0.9rem;
        border-radius: 14px;
        font-size: 0.95rem;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .bubble.assistant {
        align-self: flex-start;
        background: var(--accent-soft);
        color: var(--ink);
        border-bottom-left-radius: 4px;
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .bubble.system {
        align-self: center;
        max-width: 100%;
        background: transparent;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
        padding: 0.25rem 0.5rem;
      }

      .bubble.pending {
        opacity: 0.7;
      }

      .chat-compose {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.55);
      }

      #chat-input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.7rem 0.85rem;
        font: inherit;
        font-size: 0.95rem;
        resize: none;
        min-height: 2.6rem;
        max-height: 7rem;
        outline: none;
        background: #fff;
        color: var(--ink);
      }

      #chat-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--glow);
      }

      .chat-send {
        border: none;
        border-radius: 10px;
        padding: 0 1rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        align-self: stretch;
      }

      .chat-send:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .chatbot {
        position: fixed;
        right: 1.25rem;
        bottom: 1.25rem;
        z-index: 20;
      }

      body.chat-open .chatbot {
        display: none;
      }

      .chatbot-fab {
        width: 3.5rem;
        height: 3.5rem;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 8px 24px var(--glow);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .chatbot-fab:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px var(--glow);
      }

      .chatbot-fab svg {
        width: 1.5rem;
        height: 1.5rem;
      }

      .chatbot-nudge {
        position: absolute;
        right: calc(100% + 0.65rem);
        bottom: calc(100% - 0.35rem);
        width: max-content;
        max-width: min(22rem, calc(100vw - 6rem));
        padding: 0.55rem 0.9rem;
        border-radius: 12px 12px 2px 12px;
        background: #fff;
        color: var(--ink);
        font-size: 0.9rem;
        line-height: 1.3;
        white-space: nowrap;
        box-shadow: 0 6px 20px rgba(26, 46, 42, 0.12);
        border: 1px solid var(--line);
        opacity: 0;
        transform: translateY(4px);
        pointer-events: none;
        visibility: hidden;
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
      }

      .chatbot-nudge.is-visible {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
      }

      @media (min-width: 768px) {
        .screen {
          padding: 2.5rem 1.5rem 5.5rem;
        }

        .chatbot {
          right: 2rem;
          bottom: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <h1 class="brand">CaringBridge</h1>
      <p class="lede">Write an update for the people who care about you.</p>

      <div class="workspace">
        <div class="editor">
          <label class="sr-only" for="post">Post body</label>
          <textarea
            id="post"
            name="post"
            placeholder="Share how it today went, what you need, or a small moment that mattered…"
            autofocus
          ></textarea>
        </div>

        <aside
          id="chat-panel"
          class="chat-panel"
          aria-label="Writing assistant"
          hidden
        >
          <div class="chat-header">
            <h2>Writing assistant</h2>
            <button
              type="button"
              class="chat-close"
              id="chat-close"
              aria-label="Close assistant"
            >
              ×
            </button>
          </div>
          <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
          <form id="chat-form" class="chat-compose">
            <label class="sr-only" for="chat-input">Message</label>
            <textarea
              id="chat-input"
              rows="1"
              placeholder="Ask for help with your post…"
            ></textarea>
            <button type="submit" class="chat-send" id="chat-send">Send</button>
          </form>
        </aside>
      </div>
    </main>

    <div class="chatbot">
      <div
        id="chatbot-nudge"
        class="chatbot-nudge"
        role="status"
        aria-live="polite"
        hidden
      >
        Stuck on what to write?
      </div>
      <button
        type="button"
        class="chatbot-fab"
        id="chatbot-fab"
        aria-label="Open AI writing assistant"
        title="Open writing assistant"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 12a8 8 0 0 1 8-8h0a8 8 0 0 1 8 8v1.2a2.8 2.8 0 0 1-2.8 2.8H12l-4.2 3.2V16H9.2A5.2 5.2 0 0 1 4 10.8V12Z"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linejoin="round"
          />
          <circle cx="9.25" cy="11.25" r="1" fill="currentColor" />
          <circle cx="12" cy="11.25" r="1" fill="currentColor" />
          <circle cx="14.75" cy="11.25" r="1" fill="currentColor" />
        </svg>
      </button>
    </div>

    <script>
      (function () {
        // Local uvicorn: same-origin. GitHub Pages: Cloud Run proxy (POST
        // /api/chat is not available on static Pages — that caused HTTP 405).
        // Override anytime with ?api=https://... (persisted in localStorage).
        var DEFAULT_PAGES_API =
          "https://caringbridge-gas-341734686561.us-west1.run.app";
        var params = new URLSearchParams(window.location.search);
        var onPages = /\.github\.io$/i.test(window.location.hostname);
        var apiBase = window.localStorage.getItem("caringbridge_api_base") || "";
        if (params.has("api")) {
          apiBase = params.get("api") || "";
          if (apiBase) {
            window.localStorage.setItem("caringbridge_api_base", apiBase);
          } else {
            window.localStorage.removeItem("caringbridge_api_base");
          }
        }
        if (!apiBase && onPages) {
          apiBase = DEFAULT_PAGES_API;
        }
        var API_CHAT =
          (apiBase ? apiBase.replace(/\/$/, "") : "") + "/api/chat";

        var IDLE_MS = 30000;
        var post = document.getElementById("post");
        var nudge = document.getElementById("chatbot-nudge");
        var fab = document.getElementById("chatbot-fab");
        var panel = document.getElementById("chat-panel");
        var messagesEl = document.getElementById("chat-messages");
        var form = document.getElementById("chat-form");
        var input = document.getElementById("chat-input");
        var sendBtn = document.getElementById("chat-send");
        var closeBtn = document.getElementById("chat-close");

        var idleTimer = null;
        var sessionId = null;
        var userId = "caringbridge_" + Math.random().toString(36).slice(2, 10);
        var busy = false;
        var started = false;

        function hideNudge() {
          nudge.classList.remove("is-visible");
          nudge.hidden = true;
        }

        function showNudge() {
          if (document.body.classList.contains("chat-open")) return;
          nudge.hidden = false;
          void nudge.offsetWidth;
          nudge.classList.add("is-visible");
        }

        function resetIdleTimer() {
          hideNudge();
          clearTimeout(idleTimer);
          idleTimer = setTimeout(showNudge, IDLE_MS);
        }

        function addBubble(role, text, extraClass) {
          var el = document.createElement("div");
          el.className = "bubble " + role + (extraClass ? " " + extraClass : "");
          el.textContent = text;
          messagesEl.appendChild(el);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          return el;
        }

        function openChat() {
          document.body.classList.add("chat-open");
          panel.hidden = false;
          hideNudge();
          clearTimeout(idleTimer);
          if (!started) {
            started = true;
            addBubble("assistant", "What can I help you with?");
          }
          input.focus();
        }

        function closeChat() {
          document.body.classList.remove("chat-open");
          panel.hidden = true;
          resetIdleTimer();
          fab.focus();
        }

        function applyAgentReply(data) {
          if (data.action === "edit" && typeof data.text === "string") {
            post.value = data.text;
            post.dispatchEvent(new Event("input", { bubbles: true }));
          }
          addBubble(
            "assistant",
            data.reply || "Sorry — I didn't get a usable reply."
          );
        }

        async function askAgent(userText) {
          var res = await fetch(API_CHAT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: userText,
              draft: post.value,
              user_id: userId,
              session_id: sessionId,
            }),
          });
          var data = await res.json().catch(function () {
            return {};
          });
          if (!res.ok) {
            var detail =
              (data && data.detail) ||
              (data && data.error && data.error.message) ||
              "HTTP " + res.status;
            throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
          }
          if (data.session_id) sessionId = data.session_id;
          return data;
        }

        async function handleSend(userText) {
          if (!userText || busy) return;
          busy = true;
          sendBtn.disabled = true;
          addBubble("user", userText);
          input.value = "";
          var pending = addBubble("assistant", "Thinking…", "pending");

          try {
            var data = await askAgent(userText);
            pending.remove();
            applyAgentReply(data);
          } catch (err) {
            pending.remove();
            addBubble(
              "system",
              err && err.message
                ? err.message
                : "Something went wrong talking to the agent."
            );
          } finally {
            busy = false;
            sendBtn.disabled = false;
            input.focus();
          }
        }

        fab.addEventListener("click", openChat);
        closeBtn.addEventListener("click", closeChat);

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          handleSend(input.value.trim());
        });

        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSend(input.value.trim());
          }
        });

        post.addEventListener("input", resetIdleTimer);
        resetIdleTimer();
      })();
    </script>
  </body>
</html>
