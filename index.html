<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaringBridge — Write a post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a2e2a;
        --muted: #4a635c;
        --paper: #f7faf8;
        --line: #c5d5ce;
        --accent: #0d6e5f;
        --accent-soft: #d8efe9;
        --glow: rgba(13, 110, 95, 0.18);
        --panel: rgba(255, 255, 255, 0.86);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        font-family: "Source Sans 3", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 50% at 10% 0%, #e4f3ee 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 100% 100%, #e8f0f5 0%, transparent 50%),
          linear-gradient(165deg, #eef5f2 0%, var(--paper) 45%, #eef2f6 100%);
      }

      /* Two side-by-side pages (post, chat); opening the chat slides the
         track left so each page gets the full screen. */
      .pager {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        overflow: clip;
      }

      .pager-track {
        display: flex;
        height: 100%;
        transition: transform 0.38s cubic-bezier(0.22, 0.8, 0.24, 1);
      }

      body.chat-open .pager-track {
        transform: translateX(-100%);
      }

      @media (prefers-reduced-motion: reduce) {
        .pager-track {
          transition: none;
        }
      }

      .page {
        flex: 0 0 100%;
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .screen {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 5.5rem;
      }

      .chat-screen {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 1rem 1.25rem;
      }

      .brand {
        font-family: "Fraunces", serif;
        font-weight: 650;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        letter-spacing: -0.02em;
        margin: 0 0 0.35rem;
        color: var(--accent);
      }

      .lede {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.45;
      }

      .editor {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      label.sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .post-wrap {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.72);
      }

      /* Mirror of the textarea used to draw ghost-text suggestions. It must
         match #post's box and typography exactly so the text lines up. */
      #post-ghost,
      #post {
        border: 1px solid var(--line);
        padding: 1.25rem 1.35rem;
        font: inherit;
        font-size: 1.125rem;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      #post-ghost {
        position: absolute;
        top: 0;
        left: 0;
        margin: 0;
        border-color: transparent;
        color: transparent;
        overflow: hidden;
        pointer-events: none;
      }

      #post-ghost .ghost {
        color: #8aa39b;
      }

      #post-ghost kbd {
        margin-left: 0.4rem;
        padding: 0 0.35rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: inherit;
        font-size: 0.7rem;
        color: var(--muted);
        background: #fff;
        vertical-align: 0.15em;
      }

      #post-ghost kbd.swipe {
        display: inline-block;
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-soft);
        transition: transform 0.1s ease;
      }

      #post-ghost kbd.swipe .arrow {
        display: inline-block;
        animation: swipe-nudge 1.1s ease-in-out 3;
      }

      @keyframes swipe-nudge {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(4px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #post-ghost kbd.swipe .arrow {
          animation: none;
        }
      }

      .post-hint {
        margin: 0.4rem 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }

      #post {
        position: relative;
        flex: 1;
        width: 100%;
        min-height: min(60vh, 520px);
        resize: vertical;
        border-radius: 4px;
        color: var(--ink);
        background: transparent;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      #post::placeholder {
        color: #7a9189;
      }

      #post:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--glow);
      }

      .chat-panel {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 10px 30px rgba(26, 46, 42, 0.08);
        overflow: hidden;
      }

      .chat-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #f3faf7 0%, transparent 100%);
      }

      .chat-header h2 {
        margin: 0;
        font-family: "Fraunces", serif;
        font-size: 1.05rem;
        font-weight: 650;
        color: var(--accent);
      }

      .chat-close {
        border: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        padding: 0.45rem 0.6rem;
        margin-left: -0.4rem;
        border-radius: 6px;
        white-space: nowrap;
      }

      .chat-close:hover {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .bubble {
        max-width: 92%;
        padding: 0.7rem 0.9rem;
        border-radius: 14px;
        font-size: 0.95rem;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .bubble.assistant {
        align-self: flex-start;
        background: var(--accent-soft);
        color: var(--ink);
        border-bottom-left-radius: 4px;
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .bubble.system {
        align-self: center;
        max-width: 100%;
        background: transparent;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
        padding: 0.25rem 0.5rem;
      }

      .bubble.pending {
        opacity: 0.7;
      }

      .chat-compose {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.55);
      }

      #chat-input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.7rem 0.85rem;
        font: inherit;
        font-size: 0.95rem;
        resize: none;
        min-height: 2.6rem;
        max-height: 7rem;
        outline: none;
        background: #fff;
        color: var(--ink);
      }

      #chat-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--glow);
      }

      .chat-send {
        border: none;
        border-radius: 10px;
        padding: 0 1rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        align-self: stretch;
      }

      .chat-send:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .chatbot {
        position: fixed;
        right: 1.25rem;
        bottom: 1.25rem;
        z-index: 20;
      }

      body.chat-open .chatbot {
        display: none;
      }

      .chatbot-fab {
        width: 3.5rem;
        height: 3.5rem;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 8px 24px var(--glow);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .chatbot-fab:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px var(--glow);
      }

      .chatbot-fab svg {
        width: 1.5rem;
        height: 1.5rem;
      }

      .chatbot-nudge {
        position: absolute;
        right: calc(100% + 0.65rem);
        bottom: calc(100% - 0.35rem);
        width: max-content;
        max-width: min(22rem, calc(100vw - 6rem));
        padding: 0.55rem 0.9rem;
        border-radius: 12px 12px 2px 12px;
        background: #fff;
        color: var(--ink);
        font-size: 0.9rem;
        line-height: 1.3;
        white-space: nowrap;
        box-shadow: 0 6px 20px rgba(26, 46, 42, 0.12);
        border: 1px solid var(--line);
        opacity: 0;
        transform: translateY(4px);
        pointer-events: none;
        visibility: hidden;
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
      }

      .chatbot-nudge.is-visible {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
      }

      @media (min-width: 768px) {
        .screen {
          padding: 2.5rem 1.5rem 5.5rem;
        }

        .chat-screen {
          padding: 2.5rem 1.5rem;
        }

        .chatbot {
          right: 2rem;
          bottom: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="pager">
      <div class="pager-track">
        <main class="page" id="page-write">
          <div class="screen">
            <h1 class="brand">CaringBridge</h1>
            <p class="lede">Write an update for the people who care about you.</p>

            <div class="editor">
              <label class="sr-only" for="post">Post body</label>
              <div class="post-wrap">
                <div id="post-ghost" aria-hidden="true"></div>
                <textarea
                  id="post"
                  name="post"
                  placeholder="Share how it today went, what you need, or a small moment that mattered…"
                  aria-describedby="post-hint"
                  autofocus
                ></textarea>
              </div>
              <p id="post-hint" class="post-hint">
                Pause for a few seconds to get a suggestion.
                <span class="hint-keys">Press Tab to accept it, Esc to dismiss.</span>
              </p>
            </div>
          </div>
        </main>

        <section class="page" id="page-chat" inert>
          <div class="chat-screen">
            <aside
              id="chat-panel"
              class="chat-panel"
              aria-label="Writing assistant"
            >
              <div class="chat-header">
                <button
                  type="button"
                  class="chat-close"
                  id="chat-close"
                  aria-label="Back to your post"
                >
                  ← Your post
                </button>
                <h2>Writing assistant</h2>
              </div>
              <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
              <form id="chat-form" class="chat-compose">
                <label class="sr-only" for="chat-input">Message</label>
                <textarea
                  id="chat-input"
                  rows="1"
                  placeholder="Ask for help with your post…"
                ></textarea>
                <button type="submit" class="chat-send" id="chat-send">Send</button>
              </form>
            </aside>
          </div>
        </section>
      </div>
    </div>

    <div class="chatbot">
      <div
        id="chatbot-nudge"
        class="chatbot-nudge"
        role="status"
        aria-live="polite"
        hidden
      >
        Stuck on what to write?
      </div>
      <button
        type="button"
        class="chatbot-fab"
        id="chatbot-fab"
        aria-label="Open AI writing assistant"
        title="Open writing assistant"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 12a8 8 0 0 1 8-8h0a8 8 0 0 1 8 8v1.2a2.8 2.8 0 0 1-2.8 2.8H12l-4.2 3.2V16H9.2A5.2 5.2 0 0 1 4 10.8V12Z"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linejoin="round"
          />
          <circle cx="9.25" cy="11.25" r="1" fill="currentColor" />
          <circle cx="12" cy="11.25" r="1" fill="currentColor" />
          <circle cx="14.75" cy="11.25" r="1" fill="currentColor" />
        </svg>
      </button>
    </div>

    <script>
      (function () {
        // Local uvicorn: same-origin. GitHub Pages: Cloud Run proxy (POST
        // /api/chat is not available on static Pages — that caused HTTP 405).
        // Override anytime with ?api=https://... (persisted in localStorage).
        var DEFAULT_PAGES_API =
          "https://caringbridge-gas-341734686561.us-west1.run.app";
        var params = new URLSearchParams(window.location.search);
        var onPages = /\.github\.io$/i.test(window.location.hostname);
        var apiBase = window.localStorage.getItem("caringbridge_api_base") || "";
        if (params.has("api")) {
          apiBase = params.get("api") || "";
          if (apiBase) {
            window.localStorage.setItem("caringbridge_api_base", apiBase);
          } else {
            window.localStorage.removeItem("caringbridge_api_base");
          }
        }
        if (!apiBase && onPages) {
          apiBase = DEFAULT_PAGES_API;
        }
        var API_ROOT = apiBase ? apiBase.replace(/\/$/, "") : "";
        var API_CHAT = API_ROOT + "/api/chat";
        var API_COMPLETE = API_ROOT + "/api/complete";

        var IDLE_MS = 30000;
        var post = document.getElementById("post");
        var nudge = document.getElementById("chatbot-nudge");
        var fab = document.getElementById("chatbot-fab");
        var messagesEl = document.getElementById("chat-messages");
        var form = document.getElementById("chat-form");
        var input = document.getElementById("chat-input");
        var sendBtn = document.getElementById("chat-send");
        var closeBtn = document.getElementById("chat-close");
        var pageWrite = document.getElementById("page-write");
        var pageChat = document.getElementById("page-chat");

        var idleTimer = null;
        var sessionId = null;
        var userId = "caringbridge_" + Math.random().toString(36).slice(2, 10);
        var busy = false;
        var started = false;

        function hideNudge() {
          nudge.classList.remove("is-visible");
          nudge.hidden = true;
        }

        function showNudge() {
          if (document.body.classList.contains("chat-open")) return;
          nudge.hidden = false;
          void nudge.offsetWidth;
          nudge.classList.add("is-visible");
        }

        function resetIdleTimer() {
          hideNudge();
          clearTimeout(idleTimer);
          idleTimer = setTimeout(showNudge, IDLE_MS);
        }

        function addBubble(role, text, extraClass) {
          var el = document.createElement("div");
          el.className = "bubble " + role + (extraClass ? " " + extraClass : "");
          el.textContent = text;
          messagesEl.appendChild(el);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          return el;
        }

        function isChatOpen() {
          return document.body.classList.contains("chat-open");
        }

        // Only the visible page is focusable, so Tab can't wander off-screen.
        function showChatPage(open) {
          document.body.classList.toggle("chat-open", open);
          pageChat.inert = !open;
          pageWrite.inert = open;
          if (open) {
            hideNudge();
            clearTimeout(idleTimer);
            if (!started) {
              started = true;
              addBubble("assistant", "What can I help you with?");
            }
            // preventScroll keeps the browser from jumping the pager mid-slide.
            // Skip on touch so the keyboard doesn't cover the chat as it opens.
            if (!window.matchMedia("(pointer: coarse)").matches) {
              input.focus({ preventScroll: true });
            }
          } else {
            resetIdleTimer();
            fab.focus({ preventScroll: true });
          }
        }

        // The chat page is a history entry, so the browser / phone back
        // gesture returns to the post instead of leaving the site.
        function openChat() {
          if (isChatOpen()) return;
          history.pushState({ chat: true }, "");
          showChatPage(true);
        }

        function closeChat() {
          if (!isChatOpen()) return;
          if (history.state && history.state.chat) {
            history.back(); // popstate does the rest
          } else {
            showChatPage(false);
          }
        }

        window.addEventListener("popstate", function (e) {
          showChatPage(!!(e.state && e.state.chat));
        });

        // A reload while on the chat page starts back on the post.
        if (history.state && history.state.chat) {
          history.replaceState(null, "");
        }

        function applyAgentReply(data) {
          var edited = data.action === "edit" && typeof data.text === "string";
          if (edited) {
            post.value = data.text;
            post.dispatchEvent(new Event("input", { bubbles: true }));
          }
          addBubble(
            "assistant",
            data.reply || "Sorry — I didn't get a usable reply."
          );
          // The post is on the other page now, so say it changed.
          if (edited) addBubble("system", "Your post was updated.");
        }

        async function askAgent(userText) {
          var res = await fetch(API_CHAT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: userText,
              draft: post.value,
              user_id: userId,
              session_id: sessionId,
            }),
          });
          var data = await res.json().catch(function () {
            return {};
          });
          if (!res.ok) {
            var detail =
              (data && data.detail) ||
              (data && data.error && data.error.message) ||
              "HTTP " + res.status;
            throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
          }
          if (data.session_id) sessionId = data.session_id;
          return data;
        }

        async function handleSend(userText) {
          if (!userText || busy) return;
          busy = true;
          sendBtn.disabled = true;
          addBubble("user", userText);
          input.value = "";
          var pending = addBubble("assistant", "Thinking…", "pending");

          try {
            var data = await askAgent(userText);
            pending.remove();
            applyAgentReply(data);
          } catch (err) {
            pending.remove();
            addBubble(
              "system",
              err && err.message
                ? err.message
                : "Something went wrong talking to the agent."
            );
          } finally {
            busy = false;
            sendBtn.disabled = false;
            input.focus();
          }
        }

        fab.addEventListener("click", openChat);
        closeBtn.addEventListener("click", closeChat);
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && isChatOpen()) closeChat();
        });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          handleSend(input.value.trim());
        });

        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSend(input.value.trim());
          }
        });

        post.addEventListener("input", resetIdleTimer);
        resetIdleTimer();

        // ---- Sentence autocomplete (ghost text, Tab to accept) ----
        // Only suggest after a real pause; each suggestion is a full agent
        // round-trip, so this is not meant to fire on every keystroke.
        var COMPLETE_DELAY_MS = 2500;
        var ghostEl = document.getElementById("post-ghost");
        var suggestion = "";
        var completeTimer = null;
        var completeSeq = 0;
        var completeSessionId = null; // kept apart from the chat session
        // Phones/tablets have no Tab key: swipe right to accept instead.
        var TOUCH = window.matchMedia("(pointer: coarse)").matches;
        if (TOUCH) {
          document.querySelector("#post-hint .hint-keys").textContent =
            "Swipe right across the text to accept it, left to dismiss.";
        }

        function caretAtEnd() {
          return (
            post.selectionStart === post.selectionEnd &&
            post.selectionEnd === post.value.length
          );
        }

        function syncGhostBox() {
          // clientWidth/Height exclude the scrollbar, so wrapping matches.
          ghostEl.style.width = post.clientWidth + 2 + "px";
          ghostEl.style.height = post.clientHeight + 2 + "px";
          ghostEl.scrollTop = post.scrollTop;
        }

        function renderGhost() {
          ghostEl.textContent = "";
          if (!suggestion) return;
          ghostEl.appendChild(document.createTextNode(post.value));
          var span = document.createElement("span");
          span.className = "ghost";
          span.textContent = suggestion;
          ghostEl.appendChild(span);
          var kbd = document.createElement("kbd");
          if (TOUCH) {
            kbd.className = "swipe";
            kbd.innerHTML = 'swipe <span class="arrow">\u2192</span>';
          } else {
            kbd.textContent = "Tab";
          }
          ghostEl.appendChild(kbd);
          syncGhostBox();
        }

        function clearSuggestion() {
          completeSeq++; // drop any in-flight response
          clearTimeout(completeTimer);
          if (suggestion) {
            suggestion = "";
            renderGhost();
          }
        }

        // ?mock=1 serves canned suggestions with no backend, for trying the
        // interaction before the Cloud Run proxy has /api/complete.
        var MOCK_COMPLETE = params.get("mock") === "1";
        var MOCK_ENDINGS = [
          "and we are taking things one day at a time.",
          "and the care team has been wonderful.",
          "which gave us a lot of hope.",
          "but we are staying positive.",
        ];
        var MOCK_NEXT = [
          "Thank you all for the love and support.",
          "We will share more when we know more.",
          "Your messages mean more than you know.",
          "Please keep the notes and prayers coming.",
        ];
        var mockIndex = 0;

        function mockComplete(text) {
          var list = /[.!?]["')\]]?\s*$/.test(text) ? MOCK_NEXT : MOCK_ENDINGS;
          var completion = list[mockIndex++ % list.length];
          if (!/\s$/.test(text)) completion = " " + completion;
          return new Promise(function (resolve) {
            // Roughly the latency of a real agent round-trip.
            setTimeout(function () {
              resolve({ completion: completion });
            }, 1200);
          });
        }

        async function requestCompletion(text) {
          if (MOCK_COMPLETE) return mockComplete(text);
          var res = await fetch(API_COMPLETE, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: text,
              user_id: userId,
              session_id: completeSessionId,
            }),
          });
          if (!res.ok) return null;
          return res.json();
        }

        async function fetchSuggestion() {
          var text = post.value;
          if (text.trim().length < 3 || !caretAtEnd()) return;
          var seq = ++completeSeq;
          try {
            var data = await requestCompletion(text);
            if (data && data.session_id) completeSessionId = data.session_id;
            // Ignore stale replies: the user kept typing or moved the caret.
            if (seq !== completeSeq || post.value !== text || !caretAtEnd()) return;
            suggestion = (data && data.completion) || "";
            renderGhost();
          } catch (err) {
            // Autocomplete is best-effort; stay quiet on network errors.
          }
        }

        function acceptSuggestion() {
          var text = suggestion;
          clearSuggestion();
          post.focus();
          // execCommand keeps the insertion on the native undo stack.
          if (!document.execCommand("insertText", false, text)) {
            post.setRangeText(text, post.value.length, post.value.length, "end");
            post.dispatchEvent(new Event("input", { bubbles: true }));
          }
        }

        post.addEventListener("input", function () {
          clearSuggestion();
          completeTimer = setTimeout(fetchSuggestion, COMPLETE_DELAY_MS);
        });

        post.addEventListener("keydown", function (e) {
          if (!suggestion || e.isComposing) return;
          if (
            (e.key === "Tab" && !e.shiftKey) ||
            (e.key === "ArrowRight" && caretAtEnd())
          ) {
            e.preventDefault();
            acceptSuggestion();
          } else if (e.key === "Escape") {
            e.preventDefault();
            clearSuggestion();
          } else if (e.key.indexOf("Arrow") === 0 || e.key === "Home" || e.key === "End") {
            clearSuggestion();
          }
        });

        var SWIPE_MIN_PX = 60;
        var swipeStart = null;

        function swipeBadge() {
          return ghostEl.querySelector("kbd.swipe");
        }

        post.addEventListener(
          "touchstart",
          function (e) {
            swipeStart =
              suggestion && e.touches.length === 1
                ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
                : null;
          },
          { passive: true }
        );

        post.addEventListener(
          "touchmove",
          function (e) {
            var badge = swipeBadge();
            if (!swipeStart || !badge) return;
            // Let the badge follow the finger so the gesture feels connected.
            var dx = e.touches[0].clientX - swipeStart.x;
            badge.style.transform =
              "translateX(" + Math.max(-40, Math.min(40, dx / 2)) + "px)";
          },
          { passive: true }
        );

        post.addEventListener("touchend", function (e) {
          if (!swipeStart || !suggestion) return;
          var t = e.changedTouches[0];
          var dx = t.clientX - swipeStart.x;
          var dy = t.clientY - swipeStart.y;
          swipeStart = null;
          var badge = swipeBadge();
          if (badge) badge.style.transform = "";
          // Mostly-horizontal swipes only, so vertical scrolling still works.
          if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) < 2 * Math.abs(dy)) return;
          e.preventDefault();
          if (dx > 0) {
            acceptSuggestion();
            if (navigator.vibrate) navigator.vibrate(10);
          } else {
            clearSuggestion();
          }
        });

        post.addEventListener("mousedown", clearSuggestion);
        post.addEventListener("blur", clearSuggestion);
        post.addEventListener("scroll", syncGhostBox);
        if (window.ResizeObserver) {
          new ResizeObserver(syncGhostBox).observe(post);
        }
      })();
    </script>
  </body>
</html>
