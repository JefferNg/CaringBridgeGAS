<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaringBridge — Write a post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a2e2a;
        --muted: #4a635c;
        --paper: #f7faf8;
        --line: #c5d5ce;
        --accent: #0d6e5f;
        --accent-soft: #d8efe9;
        --glow: rgba(13, 110, 95, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: "Source Sans 3", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 50% at 10% 0%, #e4f3ee 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 100% 100%, #e8f0f5 0%, transparent 50%),
          linear-gradient(165deg, #eef5f2 0%, var(--paper) 45%, #eef2f6 100%);
      }

      .screen {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 5.5rem;
      }

      .brand {
        font-family: "Fraunces", serif;
        font-weight: 650;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        letter-spacing: -0.02em;
        margin: 0 0 0.35rem;
        color: var(--accent);
      }

      .lede {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.45;
      }

      label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #post {
        flex: 1;
        width: 100%;
        min-height: min(60vh, 520px);
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1.25rem 1.35rem;
        font: inherit;
        font-size: 1.125rem;
        line-height: 1.6;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      #post::placeholder {
        color: #7a9189;
      }

      #post:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--glow);
      }

      /* Placeholder only — no agent behavior yet */
      .chatbot-fab {
        position: fixed;
        right: 1.25rem;
        bottom: 1.25rem;
        width: 3.5rem;
        height: 3.5rem;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 8px 24px var(--glow);
        cursor: default;
        pointer-events: none;
      }

      .chatbot-fab svg {
        width: 1.5rem;
        height: 1.5rem;
      }

      @media (min-width: 768px) {
        .screen {
          padding: 2.5rem 1.5rem 5.5rem;
        }

        .chatbot-fab {
          right: 2rem;
          bottom: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <h1 class="brand">CaringBridge</h1>
      <p class="lede">Write an update for the people who care about you.</p>

      <label for="post">Post body</label>
      <textarea
        id="post"
        name="post"
        placeholder="Share how it today went, what you need, or a small moment that mattered…"
        autofocus
      ></textarea>
    </main>

    <div
      class="chatbot-fab"
      role="img"
      aria-label="AI writing assistant (coming soon)"
      title="AI assistant coming soon"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 12a8 8 0 0 1 8-8h0a8 8 0 0 1 8 8v1.2a2.8 2.8 0 0 1-2.8 2.8H12l-4.2 3.2V16H9.2A5.2 5.2 0 0 1 4 10.8V12Z"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linejoin="round"
        />
        <circle cx="9.25" cy="11.25" r="1" fill="currentColor" />
        <circle cx="12" cy="11.25" r="1" fill="currentColor" />
        <circle cx="14.75" cy="11.25" r="1" fill="currentColor" />
      </svg>
    </div>
  </body>
</html>
