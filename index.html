<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbf7f2" />
    <meta name="color-scheme" content="light only" />
    <title>CaringBridge — Write a post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Phones and tablets get the two-page swipe layout; desktop browsers
      // (even with a touchscreen) get one page with the chat under the
      // editor. iPadOS reports itself as a Mac, so check for touch too.
      (function () {
        var ua = navigator.userAgent;
        var mobile =
          (navigator.userAgentData && navigator.userAgentData.mobile) ||
          /Android|iPhone|iPad|iPod|Mobile/i.test(ua) ||
          (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        document.documentElement.classList.toggle("mobile", !!mobile);
      })();
    </script>
    <style>
      /* Warm journal palette built on CaringBridge's own plum and slate
         navy; every text pair here meets WCAG AA contrast. */
      :root {
        color-scheme: light only;
        --bg: #fbf7f2;
        --bg-blush: #f6e6ec;
        --bg-sage: #e6ede4;
        --surface: #fffdf9;
        --ink: #24384c;
        --muted: #5e6b78;
        --line: #ece2d9;
        --accent: #963862;
        --accent-hover: #843156;
        --accent-soft: #f6e6ec;
        --on-accent: #ffffff;
        --sage-soft: #e3ebe2;
        --ghost: #7d6e76;
        --bubble-1: #f6e6ec;
        --bubble-2: #e3ebe2;
        --bubble-3: #fbe8d8;
        --bubble-4: #ece6f4;
        --glow: rgba(150, 56, 98, 0.16);
        --shadow: 0 1px 2px rgba(70, 45, 55, 0.04), 0 8px 28px rgba(70, 45, 55, 0.07);
        --shadow-lift: 0 2px 4px rgba(70, 45, 55, 0.05), 0 16px 40px rgba(70, 45, 55, 0.12);
        --radius: 16px;
        --ease: cubic-bezier(0.33, 1, 0.68, 1);
        --serif: "Literata", Georgia, serif;
        --sans: "Figtree", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        font-family: var(--sans);
        color: var(--ink);
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 70% 45% at 0% 0%, var(--bg-blush) 0%, transparent 60%),
          radial-gradient(ellipse 60% 40% at 100% 100%, var(--bg-sage) 0%, transparent 60%);
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      /* Two side-by-side pages (post, chat); opening the chat slides the
         track left so each page gets the full screen. */
      .pager {
        position: relative;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        overflow: clip;
      }

      /* Mobile only: horizontal touch moves drive the pager; vertical still
         scrolls. */
      html.mobile .pager {
        touch-action: pan-y;
      }

      .pager-track {
        display: flex;
        height: 100%;
        transition: transform 0.45s var(--ease);
      }

      /* Finger-driven: the track tracks the touch with no easing. */
      .pager-track.is-dragging {
        transition: none;
      }

      body.chat-open .pager-track {
        transform: translateX(-100%);
      }

      .page {
        flex: 0 0 100%;
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .screen {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 1.25rem 1rem 5.5rem;
      }

      .chat-screen {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 1rem 1.25rem;
      }

      .brand {
        font-family: var(--sans);
        font-weight: 700;
        font-size: clamp(1.5rem, 4vw, 2rem);
        letter-spacing: -0.015em;
        margin: 0 0 0.25rem;
        color: var(--accent);
        text-align: center;
      }

      .lede {
        margin: 0 auto 1.25rem;
        max-width: 26rem;
        font-family: var(--serif);
        font-style: italic;
        color: var(--muted);
        font-size: clamp(1rem, 2.6vw, 1.1rem);
        line-height: 1.5;
        text-align: center;
        text-wrap: balance;
      }

      .editor {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      label.sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ---- Journal prompts (empty editor only) ---- */
      .prompts {
        margin: 0 0 1.25rem;
        text-align: center;
      }

      .prompts[hidden] {
        display: none;
      }

      .prompts-label {
        margin: 0 0 0.7rem;
        font-size: 0.85rem;
        color: var(--muted);
      }

      /* One row of four, shrinking to fit a phone. */
      .prompts-list {
        display: flex;
        justify-content: center;
        gap: clamp(0.5rem, 2.5vw, 1.1rem);
      }

      .prompt-chip,
      .chat-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--accent);
        font: inherit;
        font-size: 0.85rem;
        font-weight: 500;
        line-height: 1.3;
        padding: 0.45rem 0.9rem;
        cursor: pointer;
        max-width: 100%;
        text-align: left;
        box-shadow: 0 1px 2px rgba(70, 45, 55, 0.04);
        transition:
          background-color 0.3s var(--ease),
          border-color 0.3s var(--ease),
          transform 0.3s var(--ease);
      }

      .prompt-chip:hover,
      .chat-chip:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .prompt-chip:focus-visible,
      .chat-chip:focus-visible,
      .undo-bar button:focus-visible,
      .proposal-actions button:focus-visible,
      .chat-close:focus-visible,
      .chat-send:focus-visible,
      .chatbot-fab:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Prompts are soft floating bubbles, each its own tint, drifting
         slightly out of step with one another. */
      .prompt-chip {
        display: grid;
        place-items: center;
        flex: 0 1 auto;
        width: clamp(4.6rem, 20vw, 6.75rem);
        aspect-ratio: 1;
        padding: 0.4rem;
        border: none;
        border-radius: 50%;
        background: var(--bubble-1);
        color: var(--ink);
        font-size: clamp(0.75rem, 2.2vw, 0.85rem);
        line-height: 1.2;
        text-align: center;
        text-wrap: balance;
        box-shadow: var(--shadow);
        animation: float 6s ease-in-out infinite;
        transition:
          transform 0.4s var(--ease),
          box-shadow 0.4s var(--ease);
      }

      .prompt-chip:nth-child(2) {
        background: var(--bubble-2);
        animation-duration: 7s;
        animation-delay: -2s;
      }

      .prompt-chip:nth-child(3) {
        background: var(--bubble-3);
        animation-duration: 6.5s;
        animation-delay: -4s;
      }

      .prompt-chip:nth-child(4) {
        background: var(--bubble-4);
        animation-duration: 7.5s;
        animation-delay: -1s;
      }

      @keyframes float {
        50% {
          translate: 0 -6px;
        }
      }

      /* translate (float) and transform (hover) are separate properties,
         so the hover lift adds to the drift instead of fighting it. */
      .prompt-chip:hover {
        transform: scale(1.06);
        box-shadow: var(--shadow-lift);
      }

      .prompt-chip:active {
        transform: scale(0.97);
      }

      /* ---- Editor: a sheet of journal paper ---- */
      .post-wrap {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        transition: box-shadow 0.4s var(--ease);
      }

      .post-wrap:focus-within {
        box-shadow: var(--shadow-lift), 0 0 0 3px var(--glow);
      }

      /* A soft glow after the writing helper's edit is applied. */
      .post-wrap.just-updated {
        animation: updated-glow 1.6s var(--ease);
      }

      @keyframes updated-glow {
        from {
          box-shadow: var(--shadow), 0 0 0 6px var(--glow);
        }
      }

      /* Mirror of the textarea used to draw ghost-text suggestions. It must
         match #post's box and typography exactly so the text lines up. */
      #post-ghost,
      #post {
        border: 1px solid transparent;
        padding: 1.4rem 1.5rem;
        font-family: var(--serif);
        font-size: 1.125rem;
        line-height: 1.7;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      #post-ghost {
        position: absolute;
        top: 0;
        left: 0;
        margin: 0;
        color: transparent;
        overflow: hidden;
        pointer-events: none;
      }

      /* Suggestions stay quiet: soft color, gentle fade, never inserted
         until the writer chooses to. */
      #post-ghost .ghost {
        color: var(--ghost);
        animation: ghost-in 0.6s var(--ease);
      }

      @keyframes ghost-in {
        from {
          opacity: 0;
        }
      }

      #post-ghost kbd {
        margin-left: 0.4rem;
        padding: 0.05rem 0.4rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-family: var(--sans);
        font-size: 0.7rem;
        color: var(--muted);
        background: var(--bg);
        vertical-align: 0.15em;
        animation: ghost-in 0.6s var(--ease);
      }

      #post-ghost kbd.swipe {
        display: inline-block;
        color: var(--accent);
        border-color: transparent;
        background: var(--accent-soft);
        transition: transform 0.1s ease;
      }

      #post-ghost kbd.swipe .arrow {
        display: inline-block;
        animation: swipe-nudge 1.6s ease-in-out 3;
      }

      @keyframes swipe-nudge {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(4px);
        }
      }

      .post-hint {
        margin: 0.6rem 0 0;
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
        text-wrap: balance;
      }

      #post {
        position: relative;
        flex: 1;
        width: 100%;
        min-height: 11rem;
        resize: none;
        border-radius: var(--radius);
        color: var(--ink);
        background: transparent;
        outline: none;
      }

      #post::placeholder {
        color: var(--ghost);
        font-style: italic;
      }

      /* ---- Undo after an applied edit ---- */
      .undo-bar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0.75rem 0 0;
        padding: 0.6rem 0.6rem 0.6rem 1rem;
        border-radius: 12px;
        background: var(--accent-soft);
        color: var(--ink);
        font-size: 0.9rem;
        animation: rise-in 0.4s var(--ease);
      }

      .undo-bar[hidden] {
        display: none;
      }

      .undo-bar span {
        flex: 1;
      }

      .undo-bar button {
        border: none;
        border-radius: 8px;
        background: var(--surface);
        color: var(--accent);
        font: inherit;
        font-weight: 600;
        padding: 0.4rem 0.85rem;
        cursor: pointer;
        transition: background-color 0.3s var(--ease);
      }

      .undo-bar button:hover {
        background: var(--bg);
      }

      /* ---- Writing helper chat ---- */
      .chat-panel {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        border-radius: 20px;
        background: var(--surface);
        box-shadow: var(--shadow-lift);
        overflow: hidden;
      }

      .chat-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 1.1rem;
        border-bottom: 1px solid var(--line);
      }

      .chat-header h2 {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: var(--sans);
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--ink);
      }

      /* Always honest that this is AI. */
      .ai-tag {
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .chat-close {
        border: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        padding: 0.45rem 0.6rem;
        margin-left: -0.4rem;
        border-radius: 8px;
        white-space: nowrap;
        transition: background-color 0.3s var(--ease), color 0.3s var(--ease);
      }

      .chat-close:hover {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .bubble {
        max-width: 88%;
        padding: 0.75rem 1rem;
        border-radius: 18px;
        font-size: 0.95rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        animation: rise-in 0.4s var(--ease);
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .bubble.assistant {
        align-self: flex-start;
        background: var(--sage-soft);
        color: var(--ink);
        border-bottom-left-radius: 6px;
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--accent);
        color: var(--on-accent);
        border-bottom-right-radius: 6px;
      }

      .bubble.system {
        align-self: center;
        max-width: 100%;
        background: transparent;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
        padding: 0.25rem 0.5rem;
      }

      .bubble.pending {
        animation:
          rise-in 0.4s var(--ease),
          soft-pulse 1.8s ease-in-out 0.4s infinite;
      }

      @keyframes soft-pulse {
        50% {
          opacity: 0.55;
        }
      }

      /* A proposed edit: the writer decides whether it replaces the post. */
      .proposal {
        align-self: stretch;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--bg);
        overflow: hidden;
        animation: rise-in 0.4s var(--ease);
      }

      .proposal-label {
        margin: 0;
        padding: 0.6rem 1rem 0;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
      }

      .proposal-text {
        margin: 0;
        padding: 0.5rem 1rem 0.75rem;
        max-height: 14rem;
        overflow-y: auto;
        font-family: var(--serif);
        font-size: 0.95rem;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--ink);
      }

      .proposal-actions {
        display: flex;
        gap: 0.5rem;
        padding: 0.65rem 0.75rem;
        border-top: 1px solid var(--line);
      }

      .proposal-actions button {
        border-radius: 10px;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0.5rem 0.95rem;
        cursor: pointer;
        transition: background-color 0.3s var(--ease), border-color 0.3s var(--ease);
      }

      .proposal-actions button[hidden] {
        display: none;
      }

      .proposal-use {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--on-accent);
      }

      .proposal-use:hover {
        background: var(--accent-hover);
      }

      .proposal-keep {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }

      .proposal-keep:hover {
        border-color: var(--muted);
      }

      .proposal-status {
        align-self: center;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .proposal.is-decided .proposal-text {
        opacity: 0.7;
      }

      .chat-footer {
        border-top: 1px solid var(--line);
      }

      .chat-suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        padding: 0.7rem 0.85rem 0;
      }

      .chat-suggestions[hidden] {
        display: none;
      }

      .chat-chip {
        font-size: 0.8rem;
        padding: 0.4rem 0.8rem;
        animation: rise-in 0.4s var(--ease) both;
      }

      .chat-compose {
        display: flex;
        gap: 0.5rem;
        padding: 0.8rem 0.85rem;
      }

      #chat-input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0.7rem 0.9rem;
        font: inherit;
        font-size: 0.95rem;
        resize: none;
        min-height: 2.6rem;
        max-height: 7rem;
        outline: none;
        background: var(--bg);
        color: var(--ink);
        transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
      }

      #chat-input::placeholder {
        color: var(--ghost);
      }

      #chat-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--glow);
      }

      .chat-send {
        border: none;
        border-radius: 14px;
        padding: 0 1.1rem;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        align-self: stretch;
        transition: background-color 0.3s var(--ease);
      }

      .chat-send:hover {
        background: var(--accent-hover);
      }

      .chat-send:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      /* Pinned inside .pager rather than position: fixed; the pager is
         sized to the visible screen (100dvh), while mobile browsers disagree
         on whether fixed elements sit above or behind their toolbars. */
      .chatbot {
        position: absolute;
        right: 1.25rem;
        bottom: 1.25rem;
        z-index: 20;
      }

      body.chat-open .chatbot {
        display: none;
      }

      .chatbot-fab {
        width: 3.5rem;
        height: 3.5rem;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        color: var(--on-accent);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 24px var(--glow);
        cursor: pointer;
        transition: transform 0.35s var(--ease), background-color 0.35s var(--ease);
        /* A slow, calm "breath" while idle; no bouncing. */
        animation: breathe 5s ease-in-out infinite;
      }

      @keyframes breathe {
        50% {
          box-shadow: 0 8px 24px var(--glow), 0 0 0 8px var(--glow);
        }
      }

      .chatbot-fab:hover {
        transform: translateY(-2px);
        background: var(--accent-hover);
      }

      .chatbot-fab svg {
        width: 1.5rem;
        height: 1.5rem;
      }

      .chatbot-nudge {
        position: absolute;
        right: calc(100% + 0.75rem);
        bottom: calc(100% - 0.35rem);
        width: max-content;
        max-width: min(20rem, calc(100vw - 6.5rem));
        padding: 0.65rem 1rem;
        border-radius: 16px 16px 4px 16px;
        background: var(--surface);
        color: var(--ink);
        font-size: 0.9rem;
        line-height: 1.4;
        box-shadow: var(--shadow-lift);
        opacity: 0;
        transform: translateY(6px);
        pointer-events: none;
        visibility: hidden;
        transition:
          opacity 0.5s var(--ease),
          transform 0.5s var(--ease),
          visibility 0.5s;
      }

      .chatbot-nudge.is-visible {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
      }

      @media (min-width: 768px) {
        .screen {
          padding: 3rem 1.5rem 5.5rem;
        }

        .chat-screen {
          padding: 2.5rem 1.5rem;
        }

        .chatbot {
          right: 2rem;
          bottom: 2rem;
        }
      }

      /* Desktop: one scrolling page like the original; the chat opens
         under the editor instead of on its own page. */
      html:not(.mobile) body {
        overflow: auto;
      }

      html:not(.mobile) .pager {
        height: auto;
        overflow: visible;
      }

      html:not(.mobile) .pager-track {
        display: block;
        transform: none;
        transition: none;
      }

      html:not(.mobile) .page {
        height: auto;
        overflow: visible;
      }

      html:not(.mobile) #post {
        min-height: min(45vh, 420px);
        resize: vertical;
      }

      html:not(.mobile) #page-chat {
        display: none;
      }

      html:not(.mobile) body.chat-open #page-chat {
        display: block;
        animation: rise-in 0.45s var(--ease) both;
      }

      html:not(.mobile) body.chat-open #page-write .screen {
        padding-bottom: 0;
      }

      html:not(.mobile) .chat-screen {
        height: min(70vh, 640px);
        padding-bottom: 2.5rem;
      }

      html:not(.mobile) .chatbot {
        position: fixed;
      }

      html:not(.mobile) .chat-close {
        order: 1;
        margin: 0 -0.4rem 0 auto;
        font-size: 1.35rem;
      }

      /* Respect reduced motion everywhere: no slides, breaths or fades. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="pager">
      <div class="pager-track">
        <main class="page" id="page-write">
          <div class="screen">
            <h1 class="brand">CaringBridge</h1>
            <p class="lede">Write an update for the people who care about you.</p>

            <div class="editor">
              <!-- Journal prompts: each starts a sentence in the writer's own
                   voice. Shown only while the post is empty. -->
              <div id="prompts" class="prompts">
                <p class="prompts-label">Need a place to start?</p>
                <div class="prompts-list" role="group" aria-label="Writing prompts">
                  <button
                    type="button"
                    class="prompt-chip"
                    title="How are you feeling today?"
                    data-start="Today I'm feeling "
                  >
                    How I'm feeling
                  </button>
                  <button
                    type="button"
                    class="prompt-chip"
                    title="A small moment that mattered"
                    data-start="One small moment that mattered today was "
                  >
                    A small moment
                  </button>
                  <button
                    type="button"
                    class="prompt-chip"
                    title="What would help right now?"
                    data-start="Something that would really help us right now is "
                  >
                    What would help
                  </button>
                  <button
                    type="button"
                    class="prompt-chip"
                    title="What are you grateful for?"
                    data-start="I'm grateful for "
                  >
                    I'm grateful for
                  </button>
                </div>
              </div>

              <label class="sr-only" for="post">Post body</label>
              <div class="post-wrap">
                <div id="post-ghost" aria-hidden="true"></div>
                <textarea
                  id="post"
                  name="post"
                  placeholder="Share how today went, what you need, or a small moment that mattered…"
                  aria-describedby="post-hint"
                  autofocus
                ></textarea>
              </div>
              <div id="undo-bar" class="undo-bar" role="status" hidden>
                <span>Updated with the writing helper's suggestion.</span>
                <button type="button" id="undo-edit">Undo</button>
              </div>
              <p id="post-hint" class="post-hint">
                Pause for a moment and a gentle suggestion may appear.
                <span class="hint-keys">Press Tab to accept.</span>
              </p>
            </div>
          </div>
        </main>

        <section class="page" id="page-chat" inert>
          <div class="chat-screen">
            <aside
              id="chat-panel"
              class="chat-panel"
              aria-label="Writing helper (AI)"
            >
              <div class="chat-header">
                <button
                  type="button"
                  class="chat-close"
                  id="chat-close"
                  aria-label="Back to your post"
                >
                  ← Your post
                </button>
                <h2>Writing helper <span class="ai-tag">AI</span></h2>
              </div>
              <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
              <div class="chat-footer">
                <div
                  id="chat-suggestions"
                  class="chat-suggestions"
                  role="group"
                  aria-label="Suggested replies"
                  hidden
                ></div>
                <form id="chat-form" class="chat-compose">
                  <label class="sr-only" for="chat-input">Message</label>
                  <textarea
                    id="chat-input"
                    rows="1"
                    placeholder="Ask for help with your post…"
                  ></textarea>
                  <button type="submit" class="chat-send" id="chat-send">Send</button>
                </form>
              </div>
            </aside>
          </div>
        </section>
      </div>

      <div class="chatbot">
        <div
          id="chatbot-nudge"
          class="chatbot-nudge"
          role="status"
          aria-live="polite"
          hidden
        >
          Not sure where to start? I can help you find words.
        </div>
        <button
          type="button"
          class="chatbot-fab"
          id="chatbot-fab"
          aria-label="Open the writing helper (AI)"
          title="Writing helper (AI)"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 12a8 8 0 0 1 8-8h0a8 8 0 0 1 8 8v1.2a2.8 2.8 0 0 1-2.8 2.8H12l-4.2 3.2V16H9.2A5.2 5.2 0 0 1 4 10.8V12Z"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linejoin="round"
            />
            <circle cx="9.25" cy="11.25" r="1" fill="currentColor" />
            <circle cx="12" cy="11.25" r="1" fill="currentColor" />
            <circle cx="14.75" cy="11.25" r="1" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>

    <script>
      (function () {
        // Set in <head>: swipes and the two-page layout are mobile-only.
        var IS_MOBILE = document.documentElement.classList.contains("mobile");

        // Local uvicorn: same-origin. GitHub Pages: Cloud Run proxy (POST
        // /api/chat is not available on static Pages — that caused HTTP 405).
        // Override anytime with ?api=https://... (persisted in localStorage).
        var DEFAULT_PAGES_API =
          "https://caringbridge-gas-341734686561.us-west1.run.app";
        var params = new URLSearchParams(window.location.search);
        var onPages = /\.github\.io$/i.test(window.location.hostname);
        var apiBase = window.localStorage.getItem("caringbridge_api_base") || "";
        if (params.has("api")) {
          apiBase = params.get("api") || "";
          if (apiBase) {
            window.localStorage.setItem("caringbridge_api_base", apiBase);
          } else {
            window.localStorage.removeItem("caringbridge_api_base");
          }
        }
        if (!apiBase && onPages) {
          apiBase = DEFAULT_PAGES_API;
        }
        var API_ROOT = apiBase ? apiBase.replace(/\/$/, "") : "";
        var API_CHAT = API_ROOT + "/api/chat";
        var API_COMPLETE = API_ROOT + "/api/complete";

        var IDLE_MS = 30000;
        var post = document.getElementById("post");
        var nudge = document.getElementById("chatbot-nudge");
        var fab = document.getElementById("chatbot-fab");
        var messagesEl = document.getElementById("chat-messages");
        var form = document.getElementById("chat-form");
        var input = document.getElementById("chat-input");
        var sendBtn = document.getElementById("chat-send");
        var closeBtn = document.getElementById("chat-close");
        var suggestionsEl = document.getElementById("chat-suggestions");
        var pageWrite = document.getElementById("page-write");
        var pageChat = document.getElementById("page-chat");
        var pager = document.querySelector(".pager");

        // Desktop's chat sits under the post, so its button just closes it.
        if (!IS_MOBILE) {
          closeBtn.textContent = "\u00d7";
          closeBtn.setAttribute("aria-label", "Close assistant");
        }
        var track = document.querySelector(".pager-track");

        // Journal-style openers, echoing the prompts on the post page.
        var STARTER_SUGGESTIONS = [
          "Help me share how I'm feeling",
          "Help me ask for what we need",
          "Help me say thank you",
          "Help me get started",
        ];
        var FALLBACK_ASK = [
          "Yes, that sounds right",
          "Not quite — here's more",
          "Just edit the draft",
        ];
        var FALLBACK_EDIT = [
          "Looks good",
          "Make it warmer",
          "Make it shorter",
        ];

        var idleTimer = null;
        var sessionId = null;
        var userId = "caringbridge_" + Math.random().toString(36).slice(2, 10);
        var busy = false;
        var started = false;

        function hideNudge() {
          nudge.classList.remove("is-visible");
          nudge.hidden = true;
        }

        function showNudge() {
          if (document.body.classList.contains("chat-open")) return;
          nudge.hidden = false;
          void nudge.offsetWidth;
          nudge.classList.add("is-visible");
        }

        function resetIdleTimer() {
          hideNudge();
          clearTimeout(idleTimer);
          idleTimer = setTimeout(showNudge, IDLE_MS);
        }

        function clearSuggestions() {
          suggestionsEl.innerHTML = "";
          suggestionsEl.hidden = true;
        }

        function showSuggestions(items, max) {
          var list = (items || [])
            .map(function (s) {
              return typeof s === "string" ? s.trim() : "";
            })
            .filter(Boolean)
            .slice(0, max || 3);
          clearSuggestions();
          if (!list.length) return;
          list.forEach(function (text) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "chat-chip";
            btn.textContent = text;
            btn.addEventListener("click", function () {
              handleSend(text);
            });
            suggestionsEl.appendChild(btn);
          });
          suggestionsEl.hidden = false;
        }

        function suggestionsForReply(data) {
          var fromAgent = data && Array.isArray(data.suggestions) ? data.suggestions : [];
          var cleaned = fromAgent
            .map(function (s) {
              return typeof s === "string" ? s.trim() : "";
            })
            .filter(Boolean);
          if (cleaned.length) return cleaned.slice(0, 3);
          if (data && data.action === "edit") return FALLBACK_EDIT.slice();
          if (data && data.action === "ask") return FALLBACK_ASK.slice();
          return STARTER_SUGGESTIONS.slice();
        }

        function addBubble(role, text, extraClass) {
          var el = document.createElement("div");
          el.className = "bubble " + role + (extraClass ? " " + extraClass : "");
          el.textContent = text;
          messagesEl.appendChild(el);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          return el;
        }

        function isChatOpen() {
          return document.body.classList.contains("chat-open");
        }

        // Only the visible page is focusable, so Tab can't wander off-screen.
        function showChatPage(open) {
          document.body.classList.toggle("chat-open", open);
          // Drop any drag offset so the CSS transition eases from wherever
          // the finger let go to the page's resting spot.
          track.style.transform = "";
          pageChat.inert = !open;
          // On desktop both are on screen, so the post stays editable.
          pageWrite.inert = IS_MOBILE && open;
          if (open) {
            hideNudge();
            clearTimeout(idleTimer);
            if (!started) {
              started = true;
              addBubble(
                "assistant",
                "Hi, I'm an AI writing helper. I can help you find words, " +
                  "but your post stays yours: nothing changes unless you choose it."
              );
              showSuggestions(STARTER_SUGGESTIONS, 4);
            }
            // preventScroll keeps the browser from jumping the pager mid-slide.
            // Skip on touch so the keyboard doesn't cover the chat as it opens.
            if (!IS_MOBILE) {
              // Desktop: the chat opens under the editor; bring it into view.
              input.focus({ preventScroll: true });
              pageChat.scrollIntoView({ behavior: "smooth", block: "nearest" });
            } else if (!window.matchMedia("(pointer: coarse)").matches) {
              input.focus({ preventScroll: true });
            }
          } else {
            resetIdleTimer();
            fab.focus({ preventScroll: true });
          }
        }

        // The chat page is a history entry, so the browser / phone back
        // gesture returns to the post instead of leaving the site.
        function openChat() {
          if (isChatOpen()) return;
          if (IS_MOBILE) history.pushState({ chat: true }, "");
          showChatPage(true);
        }

        function closeChat() {
          if (!isChatOpen()) return;
          if (history.state && history.state.chat) {
            history.back(); // popstate does the rest
          } else {
            showChatPage(false);
          }
        }

        window.addEventListener("popstate", function (e) {
          showChatPage(!!(e.state && e.state.chat));
        });

        // A reload while on the chat page starts back on the post.
        if (history.state && history.state.chat) {
          history.replaceState(null, "");
        }

        // ---- Swipes (touch) ----
        // Anywhere on the screen: left on the post page drags over to the
        // chat, right on the post page accepts the autocomplete suggestion,
        // and right on the chat page drags back. The track follows the
        // finger, so you can hold it partway and see both pages; on release
        // it settles on the nearer page, or the one a quick flick points toward.
        var DRAG_LOCK_PX = 10; // movement before deciding swipe vs scroll
        var FLICK_PX_PER_MS = 0.4;
        var SWIPE_MIN_PX = 60; // how far a right swipe must go to accept
        var drag = null;

        function dragPoint(e) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY, t: e.timeStamp };
        }

        function swipeBadge() {
          return ghostEl.querySelector("kbd.swipe");
        }

        pager.addEventListener(
          "touchstart",
          function (e) {
            drag = null;
            if (!IS_MOBILE || e.touches.length !== 1) return;
            var p = dragPoint(e);
            drag = {
              open: isChatOpen(),
              accept: false, // true once locked as a swipe-to-accept
              start: p,
              last: p,
              prev: p,
              width: pager.clientWidth,
              locked: false,
            };
          },
          { passive: true }
        );

        pager.addEventListener(
          "touchmove",
          function (e) {
            if (!drag) return;
            var p = dragPoint(e);
            var dx = p.x - drag.start.x;
            var dy = p.y - drag.start.y;
            if (!drag.locked) {
              if (Math.abs(dx) < DRAG_LOCK_PX && Math.abs(dy) < DRAG_LOCK_PX) return;
              if (Math.abs(dx) < Math.abs(dy)) {
                drag = null; // vertical: leave it to page scrolling
                return;
              }
              drag.locked = true;
              // Rightward on the post page accepts the suggestion instead.
              drag.accept = !drag.open && dx > 0;
              if (drag.accept && !suggestion) {
                drag = null;
                return;
              }
              if (!drag.accept) track.classList.add("is-dragging");
            }
            if (e.cancelable) e.preventDefault();
            drag.prev = drag.last;
            drag.last = p;
            if (drag.accept) {
              // Let the badge follow the finger so the gesture feels connected.
              var badge = swipeBadge();
              if (badge) {
                badge.style.transform =
                  "translateX(" + Math.max(0, Math.min(40, dx / 2)) + "px)";
              }
              return;
            }
            var base = drag.open ? -drag.width : 0;
            var x = Math.max(-drag.width, Math.min(0, base + dx));
            track.style.transform = "translateX(" + x + "px)";
          },
          { passive: false }
        );

        function endDrag(e, cancelled) {
          var d = drag;
          drag = null;
          if (!d || !d.locked) return;
          var dx = d.last.x - d.start.x;
          if (d.accept) {
            var badge = swipeBadge();
            if (badge) badge.style.transform = "";
            if (!cancelled && suggestion && dx >= SWIPE_MIN_PX) {
              acceptSuggestion();
              if (navigator.vibrate) navigator.vibrate(10);
            }
            return;
          }
          track.classList.remove("is-dragging");
          var dt = d.last.t - d.prev.t;
          // A finger that paused before lifting isn't flicking.
          var still = e.timeStamp - d.last.t > 100;
          var v = dt > 0 && !still ? (d.last.x - d.prev.x) / dt : 0;
          // Fraction of the way over to the chat page, 0 (post) .. 1 (chat).
          var progress = Math.max(0, Math.min(1, (d.open ? 1 : 0) - dx / d.width));
          var toChat = cancelled
            ? d.open
            : Math.abs(v) > FLICK_PX_PER_MS
              ? v < 0
              : progress > 0.5;
          if (toChat === d.open) {
            track.style.transform = ""; // snap back to where it started
          } else if (toChat) {
            openChat();
          } else {
            closeChat(); // transform is cleared when popstate lands
          }
        }

        pager.addEventListener("touchend", function (e) {
          endDrag(e, false);
        });
        pager.addEventListener("touchcancel", function (e) {
          endDrag(e, true);
        });

        // ---- The writer stays in control of their post ----
        // The helper never rewrites the post by itself: an edit arrives as a
        // preview the writer can use or decline, and a used edit can be undone
        // until they start typing again.
        var postWrap = post.parentElement;
        var undoBar = document.getElementById("undo-bar");
        var undoBtn = document.getElementById("undo-edit");
        var undoState = null; // { before, card }
        var settingPost = false;

        function setPost(text) {
          settingPost = true;
          post.value = text;
          post.dispatchEvent(new Event("input", { bubbles: true }));
          settingPost = false;
        }

        function decideProposal(card, status, canUndo) {
          card.classList.add("is-decided");
          card.querySelector(".proposal-use").hidden = true;
          card.querySelector(".proposal-keep").hidden = true;
          card.querySelector(".proposal-undo").hidden = !canUndo;
          card.querySelector(".proposal-status").textContent = status;
        }

        function dropUndo() {
          if (!undoState) return;
          if (undoState.card) decideProposal(undoState.card, "Used in your post.", false);
          undoState = null;
          undoBar.hidden = true;
        }

        function useProposal(text, card) {
          dropUndo();
          undoState = { before: post.value, card: card };
          setPost(text);
          decideProposal(card, "Used in your post.", true);
          undoBar.hidden = false;
          postWrap.classList.remove("just-updated");
          void postWrap.offsetWidth; // restart the glow
          postWrap.classList.add("just-updated");
        }

        function undoEdit() {
          if (!undoState) return;
          var state = undoState;
          undoState = null;
          undoBar.hidden = true;
          setPost(state.before);
          if (state.card) {
            decideProposal(state.card, "Undone. Your earlier draft is back.", false);
          }
        }

        function addProposal(text) {
          var card = document.createElement("div");
          card.className = "proposal";
          card.setAttribute("role", "group");
          card.setAttribute("aria-label", "Suggested version of your post");

          var label = document.createElement("p");
          label.className = "proposal-label";
          label.textContent = "Suggested version of your post";
          var body = document.createElement("p");
          body.className = "proposal-text";
          body.textContent = text;

          var actions = document.createElement("div");
          actions.className = "proposal-actions";
          var use = document.createElement("button");
          use.type = "button";
          use.className = "proposal-use";
          use.textContent = "Use this";
          var keep = document.createElement("button");
          keep.type = "button";
          keep.className = "proposal-keep";
          keep.textContent = "Keep mine";
          var undo = document.createElement("button");
          undo.type = "button";
          undo.className = "proposal-keep proposal-undo";
          undo.textContent = "Undo";
          undo.hidden = true;
          var status = document.createElement("span");
          status.className = "proposal-status";
          status.setAttribute("role", "status");

          use.addEventListener("click", function () {
            useProposal(text, card);
          });
          keep.addEventListener("click", function () {
            decideProposal(card, "Kept your version.", false);
          });
          undo.addEventListener("click", undoEdit);

          actions.append(use, keep, undo, status);
          card.append(label, body, actions);
          messagesEl.appendChild(card);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        undoBtn.addEventListener("click", undoEdit);

        // Typing makes the post theirs again; undo would erase that work.
        post.addEventListener("input", function () {
          if (!settingPost) dropUndo();
        });

        function applyAgentReply(data) {
          var edited = data.action === "edit" && typeof data.text === "string";
          addBubble(
            "assistant",
            data.reply || "Sorry, I didn't quite catch that. Could you try again?"
          );
          if (edited) addProposal(data.text);
          showSuggestions(suggestionsForReply(data));
        }

        async function askAgent(userText) {
          var res = await fetch(API_CHAT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: userText,
              draft: post.value,
              user_id: userId,
              session_id: sessionId,
            }),
          });
          var data = await res.json().catch(function () {
            return {};
          });
          if (!res.ok) {
            var detail =
              (data && data.detail) ||
              (data && data.error && data.error.message) ||
              "HTTP " + res.status;
            throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
          }
          if (data.session_id) sessionId = data.session_id;
          return data;
        }

        async function handleSend(userText) {
          if (!userText || busy) return;
          busy = true;
          sendBtn.disabled = true;
          clearSuggestions();
          addBubble("user", userText);
          input.value = "";
          var pending = addBubble("assistant", "Thinking…", "pending");

          try {
            var data = await askAgent(userText);
            pending.remove();
            applyAgentReply(data);
          } catch (err) {
            pending.remove();
            console.error("Writing helper request failed:", err);
            addBubble(
              "system",
              "Sorry, I couldn't reach the writing helper just now. " +
                "Your post is safe. Please try again in a moment."
            );
          } finally {
            busy = false;
            sendBtn.disabled = false;
            input.focus();
          }
        }

        fab.addEventListener("click", openChat);
        closeBtn.addEventListener("click", closeChat);
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && isChatOpen()) closeChat();
        });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          handleSend(input.value.trim());
        });

        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSend(input.value.trim());
          }
        });

        post.addEventListener("input", resetIdleTimer);
        resetIdleTimer();

        // ---- Journal prompts ----
        // A prompt only starts the sentence; the rest is in their own words.
        var promptsEl = document.getElementById("prompts");

        function updatePrompts() {
          promptsEl.hidden = post.value.trim().length > 0;
        }

        promptsEl.addEventListener("click", function (e) {
          var chip = e.target.closest(".prompt-chip");
          if (!chip) return;
          var start = chip.getAttribute("data-start");
          post.focus();
          post.setSelectionRange(post.value.length, post.value.length);
          // execCommand keeps the insertion on the native undo stack.
          if (!document.execCommand("insertText", false, start)) {
            post.setRangeText(start, post.value.length, post.value.length, "end");
            post.dispatchEvent(new Event("input", { bubbles: true }));
          }
        });

        post.addEventListener("input", updatePrompts);
        updatePrompts();

        // ---- Sentence autocomplete (ghost text, Tab to accept) ----
        // Only suggest after a real pause; each suggestion is a full agent
        // round-trip, so this is not meant to fire on every keystroke.
        var COMPLETE_DELAY_MS = 2500;
        var ghostEl = document.getElementById("post-ghost");
        var suggestion = "";
        var completeTimer = null;
        var completeSeq = 0;
        var completeSessionId = null; // kept apart from the chat session
        // Phones/tablets have no Tab key: swipe right to accept instead.
        var TOUCH = IS_MOBILE;
        if (TOUCH) {
          document.querySelector("#post-hint .hint-keys").textContent =
            "Swipe right to accept.";
        }

        function caretAtEnd() {
          return (
            post.selectionStart === post.selectionEnd &&
            post.selectionEnd === post.value.length
          );
        }

        function syncGhostBox() {
          // clientWidth/Height exclude the scrollbar, so wrapping matches.
          ghostEl.style.width = post.clientWidth + 2 + "px";
          ghostEl.style.height = post.clientHeight + 2 + "px";
          ghostEl.scrollTop = post.scrollTop;
        }

        function renderGhost() {
          ghostEl.textContent = "";
          if (!suggestion) return;
          ghostEl.appendChild(document.createTextNode(post.value));
          var span = document.createElement("span");
          span.className = "ghost";
          span.textContent = suggestion;
          ghostEl.appendChild(span);
          var kbd = document.createElement("kbd");
          if (TOUCH) {
            kbd.className = "swipe";
            kbd.innerHTML = 'swipe <span class="arrow">\u2192</span>';
          } else {
            kbd.textContent = "Tab";
          }
          ghostEl.appendChild(kbd);
          syncGhostBox();
        }

        function clearSuggestion() {
          completeSeq++; // drop any in-flight response
          clearTimeout(completeTimer);
          if (suggestion) {
            suggestion = "";
            renderGhost();
          }
        }

        // ?mock=1 serves canned suggestions with no backend, for trying the
        // interaction before the Cloud Run proxy has /api/complete.
        var MOCK_COMPLETE = params.get("mock") === "1";
        var MOCK_ENDINGS = [
          "and we are taking things one day at a time.",
          "and the care team has been wonderful.",
          "which gave us a lot of hope.",
          "but we are staying positive.",
        ];
        var MOCK_NEXT = [
          "Thank you all for the love and support.",
          "We will share more when we know more.",
          "Your messages mean more than you know.",
          "Please keep the notes and prayers coming.",
        ];
        var mockIndex = 0;

        function mockComplete(text) {
          var list = /[.!?]["')\]]?\s*$/.test(text) ? MOCK_NEXT : MOCK_ENDINGS;
          var completion = list[mockIndex++ % list.length];
          if (!/\s$/.test(text)) completion = " " + completion;
          return new Promise(function (resolve) {
            // Roughly the latency of a real agent round-trip.
            setTimeout(function () {
              resolve({ completion: completion });
            }, 1200);
          });
        }

        async function requestCompletion(text) {
          if (MOCK_COMPLETE) return mockComplete(text);
          var res = await fetch(API_COMPLETE, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: text,
              user_id: userId,
              session_id: completeSessionId,
            }),
          });
          if (!res.ok) return null;
          return res.json();
        }

        async function fetchSuggestion() {
          var text = post.value;
          if (text.trim().length < 3 || !caretAtEnd()) return;
          var seq = ++completeSeq;
          try {
            var data = await requestCompletion(text);
            if (data && data.session_id) completeSessionId = data.session_id;
            // Ignore stale replies: the user kept typing or moved the caret.
            if (seq !== completeSeq || post.value !== text || !caretAtEnd()) return;
            suggestion = (data && data.completion) || "";
            renderGhost();
          } catch (err) {
            // Autocomplete is best-effort; stay quiet on network errors.
          }
        }

        function acceptSuggestion() {
          var text = suggestion;
          clearSuggestion();
          post.focus();
          // execCommand keeps the insertion on the native undo stack.
          if (!document.execCommand("insertText", false, text)) {
            post.setRangeText(text, post.value.length, post.value.length, "end");
            post.dispatchEvent(new Event("input", { bubbles: true }));
          }
        }

        post.addEventListener("input", function () {
          clearSuggestion();
          completeTimer = setTimeout(fetchSuggestion, COMPLETE_DELAY_MS);
        });

        post.addEventListener("keydown", function (e) {
          if (!suggestion || e.isComposing) return;
          if (
            (e.key === "Tab" && !e.shiftKey) ||
            (e.key === "ArrowRight" && caretAtEnd())
          ) {
            e.preventDefault();
            acceptSuggestion();
          } else if (e.key === "Escape") {
            e.preventDefault();
            clearSuggestion();
          } else if (e.key.indexOf("Arrow") === 0 || e.key === "Home" || e.key === "End") {
            clearSuggestion();
          }
        });

        // Swipe right to accept is handled with the page swipes above.

        post.addEventListener("mousedown", clearSuggestion);
        post.addEventListener("blur", clearSuggestion);
        post.addEventListener("scroll", syncGhostBox);
        if (window.ResizeObserver) {
          new ResizeObserver(syncGhostBox).observe(post);
        }
      })();
    </script>
  </body>
</html>
